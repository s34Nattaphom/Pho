<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอขอบคุณที่รับชม | NATTAPHUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --orange-main: #E35205;      
            --orange-light: #FF661A;     
            --orange-soft-bg: #FFF0E6;   
            --orange-glow: rgba(227, 82, 5, 0.15);
            
            --bg-color: #FAFAFA;         
            --card-border: rgba(227, 82, 5, 0.18);
            
            --text-main: #222222;       
            --text-muted: #666666;      
            --text-white: #FFFFFF;

            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        /* Ambient Background Canvas & Glow */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F0 50%, #FFEBE0 100%);
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(227, 82, 5, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            pointer-events: none;
            animation: pulseAmbient 10s ease-in-out infinite alternate;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes pulseAmbient {
            0% { opacity: 0.5; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 0.95; transform: translateX(-50%) scale(1.06); }
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        /* Floating Pill Navbar */
        .top-nav-wrapper {
            position: fixed;
            top: 1.5rem;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
            animation: fadeInUp 0.8s var(--ease-out-expo) forwards;
        }

        .pill-navbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 0.6rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            box-shadow: 0 10px 30px rgba(227, 82, 5, 0.08);
        }

        .nav-logo {
            color: var(--orange-main);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 1.5px;
            text-decoration: none;
            padding-right: 1.2rem;
            border-right: 1px solid rgba(227, 82, 5, 0.2);
        }

        .nav-menu-list {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .nav-menu-item a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.5rem 1.2rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s var(--ease-out-back);
        }

        .nav-menu-item a i { color: var(--orange-main); }

        .nav-menu-item a:hover {
            color: var(--orange-main);
            background: var(--orange-soft-bg);
            font-weight: 600;
            transform: translateY(-2px);
        }

        /* END MAIN CONTENT CENTERED */
        .end-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8.5rem 1.5rem 4rem;
        }

        .thank-you-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 3.5rem 2.5rem;
            max-width: 620px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(227, 82, 5, 0.12);
            animation: popIn 0.8s var(--ease-out-expo) forwards;
        }

        .thank-you-icon {
            width: 90px;
            height: 90px;
            background: var(--orange-soft-bg);
            border: 2px solid var(--card-border);
            color: var(--orange-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            margin: 0 auto 1.8rem;
            animation: floatIcon 4s ease-in-out infinite;
        }

        .thank-you-title {
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.8rem;
        }

        .orange-text {
            color: var(--orange-main);
        }

        .thank-you-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 2.2rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.35s var(--ease-out-back);
        }

        .btn-primary {
            background: var(--orange-main);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(227, 82, 5, 0.25);
        }

        .btn-primary:hover {
            background: var(--orange-light);
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(227, 82, 5, 0.35);
        }

        .btn-secondary {
            background: var(--orange-soft-bg);
            color: var(--orange-main);
            border: 1px solid rgba(227, 82, 5, 0.2);
        }

        .btn-secondary:hover {
            background: #ffffff;
            transform: translateY(-3px);
            border-color: var(--orange-main);
        }

        @media (max-width: 600px) {
            .thank-you-card { padding: 2.5rem 1.5rem; }
            .thank-you-title { font-size: 1.8rem; }
            .pill-navbar { padding: 0.5rem 1.2rem; gap: 1rem; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND CANVAS & AMBIENT GLOW -->
    <canvas id="particle-canvas"></canvas>
    <div class="ambient-glow"></div>

    <!-- POP-UP PILL NAVBAR -->
    <div class="top-nav-wrapper">
        <nav class="pill-navbar">
            <a href="index.html" class="nav-logo">NATTAPHUM</a>
            <ul class="nav-menu-list">
                <li class="nav-menu-item"><a href="index.html"><i class="fa-solid fa-house"></i><span>หน้าแรก</span></a></li>
                <li class="nav-menu-item"><a href="me.html"><i class="fa-solid fa-user"></i><span>ข้อมูลส่วนตัว</span></a></li>
                <li class="nav-menu-item"><a href="portfolio.html"><i class="fa-solid fa-folder-open"></i><span>แฟ้มสะสมผลงาน</span></a></li>
            </ul>
        </nav>
    </div>

    <!-- MAIN END CONTAINER -->
    <div class="end-container">
        <div class="thank-you-card">
            <div class="thank-you-icon">
                <i class="fa-solid fa-heart"></i>
            </div>
            <h1 class="thank-you-title">ขอขอบคุณ<span class="orange-text">ที่รับชม</span></h1>
            <p class="thank-you-desc">
                ขอขอบคุณที่ให้ความสนใจและรับชมแฟ้มสะสมผลงาน (Portfolio) ของผมครับ<br>
                หวังว่าข้อมูลและผลงานทั้งหมดนี้จะแสดงถึงความตั้งใจ ความมุ่งมั่น และทักษะการเรียนรู้ของผมครับ
            </p>
            <div class="button-group">
                <a href="index.html" class="btn-action btn-primary">
                    <i class="fa-solid fa-house"></i> กลับสู่หน้าแรก
                </a>
                <a href="portfolio.html" class="btn-action btn-secondary">
                    <i class="fa-solid fa-folder-open"></i> ดูผลงานอีกครั้ง
                </a>
            </div>
        </div>
    </div>

    <!-- BACKGROUND ANIMATION SCRIPT -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const lines = [];
        for (let i = 0; i < 35; i++) {
            lines.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 90 + 60,
                angle: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.25 + 0.1,
                width: Math.random() * 2 + 1,
                opacity: Math.random() * 0.25 + 0.1,
                rotSpeed: (Math.random() - 0.5) * 0.0015
            });
        }

        let lastTime = performance.now();
        function drawAndAnimate(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            lines.forEach(line => {
                line.x += Math.cos(line.angle) * line.speed * (deltaTime * 60);
                line.y += Math.sin(line.angle) * line.speed * (deltaTime * 60);
                line.angle += line.rotSpeed * (deltaTime * 60);

                if (line.x < -150) line.x = canvas.width + 150;
                if (line.x > canvas.width + 150) line.x = -150;
                if (line.y < -150) line.y = canvas.height + 150;
                if (line.y > canvas.height + 150) line.y = -150;

                ctx.save();
                ctx.translate(line.x, line.y);
                ctx.rotate(line.angle);

                const grad = ctx.createLinearGradient(0, 0, line.length, 0);
                grad.addColorStop(0, 'rgba(227, 82, 5, 0)');
                grad.addColorStop(0.5, `rgba(227, 82, 5, ${line.opacity})`);
                grad.addColorStop(1, 'rgba(227, 82, 5, 0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = line.width;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(line.length, 0);
                ctx.stroke();
                ctx.restore();
            });
            requestAnimationFrame(drawAndAnimate);
        }
        requestAnimationFrame(drawAndAnimate);
    </script>
</body>
</html>
