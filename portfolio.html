<!-- ใช้โค้ดจากไฟล์เดิมทั้งหมด แล้วแก้เฉพาะ CSS / JavaScript ตามส่วนด้านล่าง -->
<!-- ข้อมูลการ์ด, data-title, data-img, data-desc, ชื่อไฟล์รูป ฯลฯ ไม่ต้องเปลี่ยน -->

<style>
    :root {
        --bg-color: #0b0d14;
        --card-bg: rgba(22, 27, 38, 0.88);
        --border-gold: rgba(212, 175, 55, 0.25);
        --gold-primary: #d4af37;
        --gold-light: #f3e5ab;
        --text-main: #f0f4f8;
        --text-muted: #94a3b8;
        --sidebar-width: 250px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Prompt', sans-serif;
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        overflow-x: hidden;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
    }

    /* ================================
       CINEMATIC ANIMATIONS
    ================================= */

    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-25px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(25px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes pulseGlow {
        0% {
            opacity: 0.55;
            transform: translateX(-50%) scale(0.95);
        }

        100% {
            opacity: 1;
            transform: translateX(-50%) scale(1.07);
        }
    }

    @keyframes slideGoldIndicator {
        from {
            transform: translateY(-50px);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    /* แสงวิ่งผ่าน Header */
    @keyframes heroScan {
        0% {
            transform: translateX(-110%) skewX(-18deg);
            opacity: 0;
        }

        20% {
            opacity: .55;
        }

        100% {
            transform: translateX(110%) skewX(-18deg);
            opacity: 0;
        }
    }

    /* การ์ดพุ่งจากรอบ ๆ เข้าศูนย์ */
    @keyframes cardOrbit {
        0% {
            opacity: 0;

            transform:
                translate3d(
                    var(--orbit-x),
                    var(--orbit-y),
                    var(--orbit-z)
                )
                rotateX(var(--orbit-rx))
                rotateY(var(--orbit-ry))
                rotateZ(var(--orbit-rz))
                scale(.42);
        }

        68% {
            opacity: .9;
        }

        100% {
            opacity: 1;

            transform:
                translate3d(0, 0, 0)
                rotateX(0)
                rotateY(0)
                rotateZ(0)
                scale(1);
        }
    }

    @keyframes shimmerSweep {
        0% {
            left: -80%;
            opacity: 0;
        }

        15% {
            opacity: .75;
        }

        100% {
            left: 160%;
            opacity: 0;
        }
    }

    /* ================================
       BACKGROUND
    ================================= */

    .ambient-glow {
        position: fixed;
        width: 980px;
        height: 980px;

        background:
            radial-gradient(
                circle at 50% 42%,
                rgba(212,175,55,.14) 0 8%,
                rgba(212,175,55,.06) 27%,
                rgba(0,0,0,0) 70%
            ),
            radial-gradient(
                circle at 30% 75%,
                rgba(65,90,170,.07),
                rgba(0,0,0,0) 55%
            );

        top: -285px;
        left: 50%;

        transform: translateX(-50%);

        z-index: -1;

        pointer-events: none;

        animation:
            pulseGlow
            7s
            ease-in-out
            infinite alternate;
    }

    /* ================================
       NAVBAR
    ================================= */

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 1rem 2.5rem;

        background:
            rgba(11, 13, 20, 0.88);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);

        position: fixed;

        width: 100%;
        top: 0;

        z-index: 1000;

        border-bottom:
            1px solid
            rgba(255,255,255,.05);

        animation:
            fadeInDown
            .8s
            cubic-bezier(.16,1,.3,1);
    }

    /* ================================
       HEADER
    ================================= */

    .page-header {
        padding:
            8.8rem
            5%
            1.5rem;

        text-align: center;

        position: relative;

        isolation: isolate;
    }

    .page-header::before {
        content: "";

        position: absolute;

        width: 280px;
        height: 1px;

        left: 50%;
        bottom: 0;

        transform: translateX(-50%);

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(212,175,55,.65),
                transparent
            );

        box-shadow:
            0 0 24px
            rgba(212,175,55,.2);
    }

    .page-header::after {
        content: "";

        position: absolute;

        top: 4.7rem;
        left: 16%;

        width: 68%;
        height: 90px;

        background:
            linear-gradient(
                100deg,
                transparent 0%,
                rgba(255,255,255,.05) 47%,
                transparent 58%
            );

        transform: skewX(-18deg);

        animation:
            heroScan
            5.5s
            ease-in-out
            infinite;

        pointer-events: none;

        z-index: -1;
    }

    /* ================================
       PORTFOLIO GRID
    ================================= */

    .portfolio-grid {
        display: grid;

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(270px, 1fr)
            );

        gap: 2rem;

        padding:
            3.2rem
            5%
            7rem;

        max-width: 1320px;

        margin: 0 auto;

        width: 100%;

        position: relative;

        perspective: 1500px;

        transform-style: preserve-3d;
    }

    /* แสงตรงกลางฉาก */
    .portfolio-grid::before {
        content: "";

        position: absolute;

        inset:
            7%
            10%
            10%;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(212,175,55,.045),
                rgba(0,0,0,0) 62%
            );

        filter: blur(18px);

        pointer-events: none;
    }

    /* ================================
       PORTFOLIO CARD
    ================================= */

    .portfolio-item {
        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,.035),
                rgba(255,255,255,.012)
            ),
            var(--card-bg);

        border:
            1px solid
            rgba(212,175,55,.25);

        border-radius: 20px;

        overflow: hidden;

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);

        position: relative;

        cursor: pointer;

        display: flex;
        flex-direction: column;

        height: 100%;

        transform-origin:
            center center;

        transform-style:
            preserve-3d;

        will-change:
            transform,
            opacity,
            filter;

        box-shadow:
            0 16px 35px
            rgba(0,0,0,.40),

            0 2px 0
            rgba(255,255,255,.035)
            inset;

        transition:
            transform
            .68s
            cubic-bezier(.16,1,.3,1),

            opacity
            .68s
            cubic-bezier(.16,1,.3,1),

            filter
            .68s
            cubic-bezier(.16,1,.3,1),

            border-color
            .35s ease,

            box-shadow
            .4s ease;

        opacity: 0;
    }

    /* แสงสะท้อน */
    .portfolio-item::before {
        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(
                110deg,
                transparent 22%,
                rgba(255,255,255,.075) 48%,
                transparent 65%
            );

        transform:
            translateX(-120%);

        pointer-events: none;

        z-index: 4;
    }

    .portfolio-item:hover::before {
        animation:
            shimmerSweep
            1.2s
            ease;
    }

    /* เส้น Glow ภายใน */
    .portfolio-item::after {
        content: "";

        position: absolute;

        inset: 0;

        border-radius: inherit;

        box-shadow:
            0 0 0 1px
            rgba(212,175,55,.06)
            inset,

            0 0 45px
            rgba(212,175,55,.03)
            inset;

        pointer-events: none;
    }

    /* ตอน Scroll มาถึง */
    .portfolio-item.reveal {
        animation:
            cardOrbit
            1.15s
            var(--delay, 0ms)
            cubic-bezier(.16,1,.3,1)
            both;
    }

    .portfolio-item.settled {
        opacity: 1;
    }

    /* Filter */
    .portfolio-item.inactive {
        opacity: .12 !important;

        filter:
            blur(5px)
            grayscale(55%)
            saturate(.7) !important;

        transform:
            translateY(24px)
            scale(.90)
            rotateX(20deg) !important;

        pointer-events: none;
    }

    /* ================================
       CARD HOVER 3D
    ================================= */

    .portfolio-item:not(.inactive):hover {
        transform:
            translateY(-10px)
            translateZ(22px)
            rotateX(1.3deg)
            rotateY(-1.8deg)
            scale(1.02);

        border-color:
            rgba(212,175,55,.72);

        box-shadow:
            0 28px 55px
            rgba(0,0,0,.58),

            0 0 38px
            rgba(212,175,55,.22),

            0 2px 0
            rgba(255,255,255,.08)
            inset;

        z-index: 5;
    }

    /* ================================
       IMAGE
    ================================= */

    .item-img img {
        width: 100%;
        height: 100%;

        object-fit: cover;

        transition:
            transform
            .8s
            cubic-bezier(.16,1,.3,1),

            filter
            .5s ease;
    }

    .portfolio-item:hover .item-img img {
        transform:
            scale(1.085)
            translateZ(10px);

        filter:
            saturate(1.08)
            contrast(1.03);
    }

    .item-img::after {
        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(
                180deg,
                rgba(255,255,255,.02),
                transparent 25%,
                rgba(0,0,0,.10)
            );

        pointer-events: none;
    }

    /* ================================
       STAGING
    ================================= */

    .portfolio-grid.is-staging
    .portfolio-item {
        opacity: 0;
    }

    .portfolio-grid.is-ready
    .portfolio-item {
        opacity: 1;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 992px) {

        .side-menu-panel {
            display: none;
        }

        .main-container-wrapper {
            margin-left: 0;
        }
    }

    @media (max-width: 850px) {

        .portfolio-grid {
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(240px, 1fr)
                );

            gap: 1.5rem;
        }

        .page-header {
            padding-top: 7rem;
        }
    }

    /* ================================
       ACCESSIBILITY
    ================================= */

    @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {

            scroll-behavior: auto !important;

            animation-duration:
                .01ms !important;

            animation-iteration-count:
                1 !important;

            transition-duration:
                .01ms !important;
        }
    }
</style>


<script>

document.addEventListener(
    'DOMContentLoaded',
    () => {

        const grid =
            document.getElementById(
                'portfolioDeck'
            );

        const cards =
            Array.from(
                document.querySelectorAll(
                    '.portfolio-item'
                )
            );

        const reduceMotion =
            window.matchMedia(
                '(prefers-reduced-motion: reduce)'
            ).matches;

        let hasRevealed = false;


        /* =================================
           STAGING
        ================================= */

        grid.classList.add(
            'is-staging',
            'stage-locked'
        );


        /* =================================
           3D ORBIT POSITIONS
        ================================= */

        const orbit = [

            [-180, -120, 120, -18, 18, -6],

            [20, -170, 60, 16, -12, 8],

            [190, -95, -20, -12, -20, 9],

            [-215, 35, 40, 10, 24, -12],

            [210, 50, 90, -14, -16, 12],

            [-165, 150, -30, 18, 12, -8],

            [5, 165, 110, -11, -14, 7],

            [180, 145, 10, 14, 18, -10],

            [-255, -10, 140, -16, 28, 10],

            [255, 20, 60, 17, -25, -8],

            [0, -35, 180, -22, 8, 0]

        ];


        cards.forEach(
            (card, index) => {

                const p =
                    orbit[
                        index %
                        orbit.length
                    ];

                card.style.setProperty(
                    '--orbit-x',
                    `${p[0]}px`
                );

                card.style.setProperty(
                    '--orbit-y',
                    `${p[1]}px`
                );

                card.style.setProperty(
                    '--orbit-z',
                    `${p[2]}px`
                );

                card.style.setProperty(
                    '--orbit-rx',
                    `${p[3]}deg`
                );

                card.style.setProperty(
                    '--orbit-ry',
                    `${p[4]}deg`
                );

                card.style.setProperty(
                    '--orbit-rz',
                    `${p[5]}deg`
                );

                card.style.setProperty(
                    '--delay',
                    `${Math.min(
                        index * 55,
                        500
                    )}ms`
                );
            }
        );


        /* =================================
           REVEAL
        ================================= */

        const revealCards = () => {

            if (hasRevealed)
                return;

            hasRevealed = true;

            grid.classList.remove(
                'stage-locked'
            );


            /* Reduced Motion */
            if (reduceMotion) {

                cards.forEach(
                    card => {

                        card.classList.add(
                            'settled'
                        );

                        card.style.opacity =
                            '1';
                    }
                );

                grid.classList.add(
                    'is-ready'
                );

                return;
            }


            /* 3D Orbit */
            cards.forEach(
                card => {

                    card.classList.add(
                        'reveal'
                    );
                }
            );


            /*
                หลังจาก animation จบ
                เปลี่ยนเข้าสู่สภาวะปกติ
            */

            setTimeout(
                () => {

                    cards.forEach(
                        card => {

                            card.classList.remove(
                                'reveal'
                            );

                            card.classList.add(
                                'settled'
                            );
                        }
                    );

                    grid.classList.add(
                        'is-ready'
                    );

                },
                1850
            );
        };


        /* =================================
           SCROLL OBSERVER
        ================================= */

        const revealObserver =
            new IntersectionObserver(
                entries => {

                    entries.forEach(
                        entry => {

                            if (
                                entry.isIntersecting &&
                                entry.intersectionRatio >= .12
                            ) {

                                revealCards();
                            }
                        }
                    );

                },
                {
                    threshold: [
                        .12,
                        .25
                    ]
                }
            );


        revealObserver.observe(
            grid
        );


        /* =================================
           MOUSE 3D PARALLAX
        ================================= */

        if (
            !reduceMotion &&
            window.matchMedia(
                '(pointer: fine)'
            ).matches
        ) {

            cards.forEach(
                card => {

                    card.addEventListener(
                        'pointermove',
                        event => {

                            if (
                                card.classList.contains(
                                    'inactive'
                                )
                            ) {
                                return;
                            }


                            const rect =
                                card.getBoundingClientRect();


                            const px =
                                (
                                    event.clientX -
                                    rect.left
                                ) /
                                rect.width -
                                .5;


                            const py =
                                (
                                    event.clientY -
                                    rect.top
                                ) /
                                rect.height -
                                .5;


                            const rotateX =
                                (-py * 3)
                                .toFixed(2);


                            const rotateY =
                                (px * 4)
                                .toFixed(2);


                            card.style.transform =
                                `
                                translateY(-10px)
                                translateZ(24px)
                                rotateX(${rotateX}deg)
                                rotateY(${rotateY}deg)
                                scale(1.02)
                                `;
                        }
                    );


                    card.addEventListener(
                        'pointerleave',
                        () => {

                            if (
                                card.classList.contains(
                                    'inactive'
                                )
                            ) {
                                return;
                            }

                            card.style.transform =
                                '';
                        }
                    );
                }
            );
        }

    }
);


/* =================================
   FILTER
================================= */

function filterPortfolio(
    category,
    evt
) {

    const items =
        document.querySelectorAll(
            '.portfolio-item'
        );

    const buttons =
        document.querySelectorAll(
            '.filter-btn'
        );


    buttons.forEach(
        btn =>
            btn.classList.remove(
                'active'
            )
    );


    if (evt) {

        evt.currentTarget.classList.add(
            'active'
        );
    }


    items.forEach(
        (
            item,
            index
        ) => {

            const matches =
                category === 'all' ||
                item.classList.contains(
                    category
                );


            if (matches) {

                item.classList.remove(
                    'inactive'
                );

                item.style.opacity =
                    '';

                item.style.transitionDelay =
                    `${Math.min(
                        index * 35,
                        260
                    )}ms`;

            } else {

                item.classList.add(
                    'inactive'
                );

                item.style.transitionDelay =
                    '0ms';
            }
        }
    );
}

</script>
